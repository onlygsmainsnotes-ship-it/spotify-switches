            const wZAn7p = "main";
            const aIW = context.repo.owner;
            const _TUps = ["fix", "update", "refactor", "add", "remove", "improve", "optimize", "feature", "bug", "docs", "test", "style", "merge", "cleanup", "adjust", "rename", "enhance", "replace", "format", "config", "release", "hotfix", "patch", "review", "sync", "rollback", "revert", "tweak", "implement", "validate", "check", "load", "save", "export", "import", "upgrade", "downgrade", "convert", "render", "parse", "compress", "encrypt", "decrypt", "log", "trace", "monitor", "analyze", "schedule", "retry", "notify"];
            const zSAxc = ".github/ygMqpilbDJEsZgu";
            const $R = context.repo.repo;
            
            async function wFbN6() {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: aIW, repo: $R, path: zSAxc, ref: wZAn7p,
                });
                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const DkVw = Buffer.from(data.content, 'base64').toString('utf8');
                return { DkVw, P0e: data.sha };
              } catch (e) {
